<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: striped awning with sign on top, then one phone-width game column (max 520px): status chips, customer, work area. */
:root{--bg:#e3f4ee;--card:#ffffff;--ink:#173038;--mut:#4d6870;--acc:#d63a2f;--onacc:#ffffff;--sun:#ffc43d;--ok:#1b8f5a;--onok:#ffffff;--bad:#c42b26;--line:#c2dfd5;--soft:#d2ebe2;--stripe:#ffffff;--fd:"Baloo 2",system-ui,sans-serif;--fb:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2226;--card:#1a373f;--ink:#e9f6f1;--mut:#9fc1b9;--acc:#ff6a5c;--onacc:#2b0a07;--sun:#ffd166;--ok:#4ccf8f;--onok:#052a19;--bad:#ff8a84;--line:#2c5059;--soft:#244850;--stripe:#eadfca;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2226;--card:#1a373f;--ink:#e9f6f1;--mut:#9fc1b9;--acc:#ff6a5c;--onacc:#2b0a07;--sun:#ffd166;--ok:#4ccf8f;--onok:#052a19;--bad:#ff8a84;--line:#2c5059;--soft:#244850;--stripe:#eadfca;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:600;font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
#app{max-width:520px;margin:0 auto}
h1,h2{font-family:var(--fd);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:36px}h2{font-size:24px}
p{margin:6px 0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button[disabled]{cursor:default}
.awn svg{display:block;width:100%;height:auto}
.awn text{font-family:var(--fd)}
.s0{fill:var(--acc)}.s1{fill:var(--stripe)}
.dec{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:2px}
.dec svg{width:42px;height:42px}
svg{max-width:100%}
.hero{text-align:center;margin:12px 0 8px}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:4px}
.pair svg{width:72px;height:72px}
.chips{display:flex;gap:8px;margin:10px 0}
.chip{flex:1;min-width:0;background:var(--card);border:0;border-radius:14px;padding:6px 4px;text-align:center;font-family:var(--fd);font-weight:800;font-size:17px;line-height:1.25}
.chip small{display:block;color:var(--mut);font-family:var(--fb);font-size:12px;font-weight:800}
.chip svg{width:26px;height:26px;display:block;margin:0 auto}
.cust{display:flex;gap:12px;align-items:center;margin:12px 0}
.cust>svg{width:78px;height:78px;flex:none}
.bub{position:relative;flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.bub::before{content:"";position:absolute;left:-9px;top:28px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.box{background:var(--card);border-radius:16px;padding:10px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border:0}
.row>svg{width:44px;height:44px;flex:none}
.row .nm{flex:1;min-width:0}
.row small{display:block;color:var(--mut);font-weight:800}
.row .q{font-family:var(--fd);font-weight:800;font-size:24px;color:var(--acc)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:12px 18px;background:var(--acc);color:var(--onacc);font-family:var(--fd);font-weight:800;font-size:19px;min-height:48px}
.btn.ok{background:var(--ok);color:var(--onok)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4}
.btn,.mi,.bills button,.tc,.who button{transition:transform .08s}
.btn:active,.mi:active,.bills button:active,.tc:active,.who button:active{transform:scale(.96)}
.lnk{background:none;border:0;color:var(--acc);font-weight:800;text-decoration:underline;padding:8px;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px;font-family:var(--fd);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center}
.who button[aria-pressed="true"]{border-color:var(--acc);background:var(--soft)}
.who svg{width:72px;height:72px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.board div{text-align:center;font-size:12px;font-weight:800;min-width:0}
.board svg{width:100%;max-width:52px;height:auto}
.board small{display:block;color:var(--mut)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px;font-family:var(--fd);font-weight:800;font-size:18px;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#2b2100}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mi{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12px;min-width:0;min-height:90px}
.mi svg{width:50px;height:50px}
.mi small{color:var(--mut);font-weight:800;font-size:11px}
.mi .cnt{position:absolute;top:-7px;right:-4px;background:var(--acc);color:var(--onacc);border-radius:12px;min-width:24px;height:24px;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;padding:8px;background:var(--soft);border-radius:14px;align-items:center;margin-top:4px}
.tc{display:flex;align-items:center;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 8px 2px 2px;font-family:var(--fd);font-weight:800;font-size:18px}
.tc svg{width:32px;height:32px}
.empty{color:var(--mut);font-size:14px}
.fb{color:var(--bad);font-weight:800;min-height:24px;margin:6px 0}
.hint{background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:15px}
.sum{text-align:center;font-family:var(--fd);font-weight:800;font-size:21px;margin:8px 0}
.opts{display:grid;gap:8px;margin:8px 0}
.bills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.bills button{background:none;border:0;padding:0}
.bl{display:block;width:100%}
.gv{display:flex;flex-wrap:wrap;gap:4px;min-height:56px;background:var(--soft);border-radius:14px;padding:6px;align-items:center;margin-top:4px}
.gv button{background:none;border:0;padding:0;width:84px}
.stars{display:flex;justify-content:center;gap:4px;margin:8px 0}
.stars svg{width:46px}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
/* Adegan pembeli makan seblak */
.scene{display:flex;justify-content:center;margin:6px 0 0}
.scene svg{width:min(100%,320px);height:auto;display:block;border-radius:18px}
.sbg{fill:var(--soft)}
.sb{text-align:center;margin:8px 0;font-family:var(--fd);font-weight:800;font-size:19px}
.sb::before{display:none}
.scene .ab{transform-box:fill-box;transform-origin:center}
.scene .head{transform-origin:50% 100%;animation:zidle 3s ease-in-out infinite}
.scene .hand{transform-origin:50% 100%;opacity:0;transition:opacity .2s}
.scene .hot{opacity:0;transition:opacity 1.2s}
.scene .eyes{animation:zblink 4s infinite}
.scene .bl,.scene .br{transition:transform .4s}
.scene .m-open,.scene .m-chew,.scene .m-hot,.scene .m-grin{opacity:0}
.scene .m-smile{opacity:1}
.scene .sw,.scene .ste,.scene .tear{opacity:0}
.scene .bowlg{animation:zbowl .5s ease-out both}
.scene .bs{animation:zbs 2.6s ease-in-out infinite}
.scene[data-stage="eat"] .m-smile,.scene[data-stage="pedas"] .m-smile,.scene[data-stage="makasih"] .m-smile{opacity:0}
.scene[data-stage="eat"] .spoon{animation:zspoon 1.3s ease-in-out 2 both}
.scene[data-stage="eat"] .bite{animation:zbite 1.3s linear 2 both}
.scene[data-stage="eat"] .m-open{animation:zopen 1.3s linear 2 both}
.scene[data-stage="eat"] .m-chew{animation:zchew 1.3s linear 2 both}
.scene[data-stage="eat"] .cheek{animation:zcheek 1.3s linear 2 both}
.scene[data-stage="pedas"] .m-hot{opacity:1;animation:zhah .25s ease-in-out infinite alternate}
.scene[data-stage="pedas"] .hot{opacity:.5}
.scene[data-stage="pedas"] .eyes{animation:zsquint .5s ease-in-out infinite alternate}
.scene[data-stage="pedas"] .bl{transform:translateY(2px) rotate(-14deg)}
.scene[data-stage="pedas"] .br{transform:translateY(2px) rotate(14deg)}
.scene[data-stage="pedas"] .head{animation:zshake .12s linear infinite}
.scene[data-stage="pedas"] .hand{opacity:1;animation:zfan .16s ease-in-out infinite alternate}
.scene[data-stage="pedas"] .sw{animation:zdrip 1.1s ease-in infinite}
.scene[data-stage="pedas"] .ste{animation:zsteam 1s ease-out infinite}
.scene[data-stage="pedas"] .tear{animation:ztear 1.2s ease-in infinite}
.scene[data-stage="makasih"] .m-grin{opacity:1}
.scene[data-stage="makasih"] .hot{opacity:.14}
.scene[data-stage="makasih"] .head{animation:znod 1.6s ease-in-out infinite}
.scene[data-stage="makasih"] .hand{opacity:1;animation:zwave .5s ease-in-out infinite alternate}
@keyframes zidle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes zblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes zsquint{from{transform:scaleY(.28)}to{transform:scaleY(.16)}}
@keyframes zspoon{0%{transform:translateY(0)}12%{transform:translateY(6px)}34%{transform:translateY(-44px)}54%{transform:translateY(-44px)}72%,100%{transform:translateY(0)}}
@keyframes zbite{0%,48%{opacity:1}50%,100%{opacity:0}}
@keyframes zopen{0%,30%{opacity:0}38%,52%{opacity:1}58%,100%{opacity:0}}
@keyframes zchew{0%,30%{opacity:1;transform:scaleY(1)}36%,54%{opacity:0}58%{opacity:1;transform:scaleY(1)}68%{transform:scaleY(.4)}78%{transform:scaleY(1)}88%{transform:scaleY(.4)}100%{opacity:1;transform:scaleY(1)}}
@keyframes zcheek{0%,56%{transform:scale(1)}68%{transform:scale(1.3)}78%{transform:scale(1)}88%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes zhah{from{transform:scale(.92)}to{transform:scale(1.08)}}
@keyframes zshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes zfan{from{transform:translate(-38px,-30px) rotate(-16deg)}to{transform:translate(-38px,-30px) rotate(16deg)}}
@keyframes zdrip{0%{opacity:0;transform:translateY(-3px)}25%{opacity:1}100%{opacity:0;transform:translateY(24px)}}
@keyframes zsteam{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.85}100%{opacity:0;transform:translateY(-26px) scale(1.5)}}
@keyframes ztear{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes znod{0%,100%{transform:rotate(0)}40%{transform:rotate(5deg) translateY(2px)}}
@keyframes zwave{from{transform:translate(8px,-40px) rotate(-14deg)}to{transform:translate(8px,-40px) rotate(14deg)}}
@keyframes zbowl{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes zbs{0%{opacity:0;transform:translateY(0)}40%{opacity:.55}100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cook{background:var(--card);border-radius:16px;padding:12px;margin:10px 0;text-align:center}
.cook .pot{width:110px;margin:0 auto;animation:zidle 1.2s ease-in-out infinite}
.cdots{display:flex;justify-content:center;gap:8px;margin:8px 0}
.cdots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.cdots i.on{background:var(--ok)}.cdots i.now{background:var(--sun)}
.meter{position:relative;height:30px;border-radius:15px;background:var(--soft);margin:12px 4px;overflow:hidden}
.meter b{position:absolute;left:35%;width:30%;top:0;bottom:0;background:var(--ok);opacity:.55}
.meter span{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:var(--acc);border-radius:4px}
/* === FULLSCREEN TANPA SCROLL === */
:root{padding:0!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0;width:100%;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))!important}
#app{width:min(520px,100%);transform-origin:top center;will-change:transform}
</style>

function mkOpts(t){const s=new Set([t]);let k=0;while(s.size<3&&k++<60){const d=(1+rnd(3))*1000*(Math.random()<.5?-1:1);if(t+d>0)s.add(t+d)}return shuf([...s])}
function newCust(){
  const d=S.day,maxK=Math.min(2+Math.floor((d-1)/3),4),maxQ=Math.min(1+Math.floor(d/2),4),cap=Math.min(15000+d*5000,60000);
  let items,total,t=0;
  const SB=BY.seblak,others=MENU.filter(m=>m.id!=="seblak"&&(m.k==="minum"||(S.stock[m.id]||0)>0));
  do{const pool=shuf(others).slice(0,d<2?rnd(2):1+rnd(maxK-1));items=[SB,...pool].map(m=>({m,q:Math.min(1+rnd(maxQ),m.id==="seblak"||m.k==="minum"?9:S.stock[m.id]||0)}));total=sum(items.map(x=>x.q*x.m.p))}while(total>cap&&t++<300);
  if(total>cap){items=[{m:SB,q:1}];total=SB.p}
  const ok=[2000,5000,10000,20000,50000,100000].filter(b=>b>=total),pay=ok[Math.random()<.7?0:rnd(Math.min(ok.length,3))];
  G.c={face:{k:["boy","girl"][rnd(2)],i:rnd(12)},items,total,pay,change:pay-total,phase:"ambil",err:0,tray:{},given:[],hint:0,wrong:[],opts:null,fb:"",say:"Halo Kak! Aku mau beli seblak. Ini pesananku ya."};
}
function begin(){if(STORY[S.day]&&S.story<S.day){ST={i:0};S.story=S.day;save();view="story";render();window.scrollTo(0,0);return}beginDay()}
function beginDay(){G={n:0,N:6,good:0,kas:0,tabm:(G&&G.tabm)||"makan",stars:0};newCust();view="play";render();window.scrollTo(0,0)}
function fin(msg){const c=G.c;c.phase="selesai";c.say=msg;c.fb="";if(!c.err)G.good++;G.kas+=c.total+(c.tip||0);SFX.win()}
function endDay(){
  const g=G.good,st=g>=6?3:g>=5?2:g>=4?1:0;G.stars=st;
  if(st>0){S.tab+=G.kas;S.stars[S.day]=Math.max(S.stars[S.day]||0,st);save();SFX.win()}else SFX.bad();
  view="end";render();window.scrollTo(0,0);
}
function readText(){
  const c=G.c,list=c.items.map(x=>x.q+" "+x.m.n).join(", ");
  if(c.phase==="ambil")return "Aku mau beli "+list+".";
  if(c.phase==="total")return "Berapa total semuanya? "+c.items.map(x=>x.q+" "+x.m.n+", harga satuan "+wd(x.m.p)).join(". ");
  if(c.phase==="kembali")return "Total "+wd(c.total)+". Aku bayar "+wd(c.pay)+". Berapa kembaliannya?";
  return c.say;
}

const ACT={
  who(v){S.who=v;save();SFX.tap();render()},

  dapur(){G=G||{};G.c={phase:"masak",ck:{s:0,pos:0,d:1,t:0,msg:"",steps:[["Tumis bumbu","Tumis bawang &amp; cabai sampai wangi"],["Rebus kuah","Masukkan kerupuk &amp; topping ke kuah"],["Tambah pedas","Taburkan cabai biar nendang"],["Aduk minuman","Ketuk 6 kali untuk mengaduk"]]}};view="dapur";SFX.tap();render();window.scrollTo(0,0)},
  badd(v){if(sum(Object.values(B.bag))>=20)return;B.bag[v]=(B.bag[v]||0)+1;B.fb="";SFX.tap();render()},
  brem(v){if(B.bag[v])B.bag[v]--;B.fb="";SFX.tap();render()},

    const d=[];B.need.forEach(x=>{const h=B.bag[x.m.id]||0;if(h<x.q)d.push(`Masih kurang ${x.q-h} ${x.m.n}.`);if(h>x.q)d.push(`${x.m.n} kelebihan ${h-x.q}.`)});
    Object.keys(B.bag).forEach(k=>{if(B.bag[k]>0&&!B.need.some(x=>x.m.id===k))d.push(`${BY[k].n} tidak ada di daftar.`)});

    const cost=B.need.reduce((a,x)=>a+x.q*x.m.p/2,0);S.tab=Math.max(0,S.tab-cost);save();SFX.coin();SFX.win();begin()
  },
  read(){say(readText())},
  tabm(v){G.tabm=v;SFX.tap();render()},
  add(v){const c=G.c;if(c.phase!=="ambil"||sum(Object.values(c.tray))>=20)return;c.tray[v]=(c.tray[v]||0)+1;c.fb="";SFX.tap();render()},
  rem(v){const c=G.c;if(c.tray[v])c.tray[v]--;c.fb="";SFX.tap();render()},
  serve(){
    const c=G.c,d=[];
    MENU.forEach(m=>{const need=(c.items.find(x=>x.m.id===m.id)||{q:0}).q,have=c.tray[m.id]||0;if(have<need)d.push(`Masih kurang ${need-have} ${m.n}.`);if(have>need)d.push(`${m.n} kelebihan ${have-need}.`)});
    if(!d.length){rec("ambil",true);c.items.forEach(x=>{if(S.stock[x.m.id])S.stock[x.m.id]=Math.max(0,S.stock[x.m.id]-x.q)});save();c.phase="masak";c.say="Sebentar ya, aku masakkan dulu!";c.fb="";c.ck={s:0,pos:0,d:1,t:0,msg:"",steps:[["Tumis bumbu","Tumis bawang &amp; cabai sampai wangi"],["Rebus kuah","Masukkan kerupuk &amp; topping ke kuah"],["Tambah pedas","Taburkan cabai biar nendang"]].concat(c.items.some(x=>x.m.k==="minum")?[["Aduk minuman","Ketuk 6 kali untuk mengaduk"]]:[])};SFX.ok()}
    else{rec("ambil",false);c.err++;c.fb=d.join(" ");SFX.bad()}
    render();
  },

    if(k.pos>=35&&k.pos<=65){k.s++;k.msg="Pas! Mantap!";SFX.ok();k.pos=0;k.q=null;k.qd=false}else{k.msg="Meleset, coba lagi!";k.miss=(k.miss||0)+1;SFX.bad()}

  eng(v){const k=G.c.ck;if(v===k.q.a){k.qd=true;k.msg="Correct! ✔ "+k.q.a+" = "+k.q.id;SFX.ok();say2(k.q.a)}else{k.msg="Not yet. Try again!";SFX.bad()}render()},
  lanjut(){if(view==="dapur"){ACT.dapur();return}const c=G.c;{const m=c.ck.miss||0;c.tip=m===0?2000:m<=2?1000:0}c.phase="total";c.opts=mkOpts(c.total);c.say="Terima kasih! Berapa semuanya, Kak?";c.fb="";SFX.ok();render()},
  hint(){const c=G.c;c.hint=Math.min(2,c.hint+1);SFX.tap();render()},
  pick(v){
    const c=G.c;v=+v;
    if(v===c.total){rec("total",true);c.fb="";
      if(!c.change)fin("Uang pas! Terima kasih, Kak.");
      else{c.phase="kembali";c.say="Ini uangnya ya. Jangan lupa kembaliannya!";SFX.ok()}}
    else{rec("total",false);c.err++;c.wrong.push(v);c.hint=Math.min(2,c.hint+1);c.fb="Belum tepat. Coba hitung lagi.";SFX.bad()}
    render();
  },
  giv(v){const c=G.c;if(c.given.length<30)c.given.push(+v);c.fb="";SFX.coin();render()},
  take(v){G.c.given.splice(+v,1);G.c.fb="";SFX.tap();render()},
  clr(){G.c.given=[];G.c.fb="";SFX.tap();render()},
  done(){

  if(drink)steps.push(["Aduk minuman","Ketuk 6 kali untuk mengaduk","stir"]);

<script>
/* Pas-kan seluruh game ke layar (tanpa scroll) */
(function(){
  var app=document.getElementById("app"),raf=0;
  function fit(){
    raf=0;
    app.style.transform="none";
    var b=document.body,cs=getComputedStyle(b);
    var availH=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    var availW=b.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    var h=app.offsetHeight,w=app.offsetWidth;
    if(!h||!w)return;
    var s=Math.min(availH/h,availW/w);
    var dy=Math.max(0,(availH-h*s)/2);
    app.style.transform="translateY("+dy+"px) scale("+s+")";
  }
  function req(){if(!raf)raf=requestAnimationFrame(fit)}
  addEventListener("resize",req);addEventListener("orientationchange",req);
  var mo=new MutationObserver(req);
  ["view","dec","awn"].forEach(function(id){mo.observe(document.getElementById(id),{childList:true,subtree:true,characterData:true})});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(req);
  addEventListener("load",req);
  req();
})();
</script>
